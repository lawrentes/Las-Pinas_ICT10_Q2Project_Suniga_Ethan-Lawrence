<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Elements</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
        }
        .header {
            background-color: #1e6fd9;
            color: white;
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
        }
        .instructions {
            background-color: #dceeff;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        #result {
            background-color: #f4f4f4;
            border-left: 4px solid #1e6fd9;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Non-Metal Elements</h2>
        <p>Periodic Table Information Finder</p>
    </div>

    <div class="instructions">
        <strong>Instructions:</strong><br>
        Enter the <strong>symbol</strong> of a non-metal element (Example: H, O, Cl, Ne, Yg).
    </div>

    <label for="element_input"><strong>[Element Symbol]</strong></label>
    <input type="text" id="element_input" placeholder="Enter symbol...">

    <button py-click="check_details">Check Details</button>

    <h5>[Results]</h5>
    <div id="result">Results will appear here...</div>
</div>

<script type="py" src="./main.py"></script>
</body>
</html>
